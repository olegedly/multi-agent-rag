services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ".env"
    expose:
      - "8000"

  caddy:
    profiles: ["production"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data

volumes:
  caddy_data:
