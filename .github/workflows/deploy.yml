name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/multi-agent-rag-be:latest

      - name: Build and push Caddy image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/multi-agent-rag-fe:latest

      - name: Trigger Deployment Webhook
        run: |
          echo "=== Debug Information ==="
          echo "WEBHOOK_URL is set: ${{ secrets.WEBHOOK_URL != '' }}"
          echo "WEBHOOK_SECRET is set: ${{ secrets.WEBHOOK_SECRET != '' }}"
          echo "First 10 chars of WEBHOOK_URL: ${WEBHOOK_URL:0:10}..."
          echo "First 10 chars of WEBHOOK_SECRET: ${WEBHOOK_SECRET:0:10}..."
          echo ""
          echo "=== Testing Connectivity ==="
          curl -X POST ${{ secrets.WEBHOOK_URL }} \
            -H "Authorization: Bearer ${{ secrets.WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}"
            }'
