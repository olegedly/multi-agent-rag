[project]
name = "multi-agent-rag"
version = "0.1.0"
description = "A production-grade multi-agent research system built with Google ADK, MCP, and pgvector. Three specialist AI agents (Researcher, Critic, Synthesizer) collaborate via the Model Context Protocol to answer questions about MCP and ADK documentation — cited, grounded, and streamed live to a SolidJS dashboard."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ag-ui-adk>=0.6.5",
    "asyncpg>=0.31.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.136.3",
    "pgvector>=0.4.2",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.50",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # ADK internals — upstream will remove BaseAgentConfig in a future release
    "ignore:BaseAgentConfig is deprecated:DeprecationWarning",
    # TestClient / httpx — StarletteDeprecationWarning (inherits UserWarning, not DeprecationWarning)
    "ignore::UserWarning:fastapi.testclient",
    # ADK experimental auth — works correctly, labelled experimental by upstream
    "ignore::UserWarning:ag_ui_adk.adk_agent",
    "ignore::UserWarning:google.adk.auth.credential_service",
]
markers = ["httpx_mock: marks tests that use pytest-httpx (deselect with '-m \"not httpx_mock\"')"]

[tool.pyright]
venvPath = ".venv"
exclude = [
    "**/.git/**",
    "**/__pycache__/**",
    "**/.venv/**",
    "**/node_modules/**",
]
typeCheckingMode = "standard"

[tool.fastapi]
entrypoint = "backend.main:app"
