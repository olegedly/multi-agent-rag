services:
  db:
    image: pgvector/pgvector:pg18
    container_name: "pgvector-db"
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    volumes:
      - ./backend:/app/backend
    command: ["fastapi", "dev", "backend/main.py", "--port", "8000", "--host", "0.0.0.0"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
