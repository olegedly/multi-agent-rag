services:
  backend:
    image: "ghcr.io/olegedly/multi-agent-rag-be:latest"
    pull_policy: always
    expose:
      - "8000"
    volumes:
      - "demo_budget:/data"
  frontend:
    image: "ghcr.io/olegedly/multi-agent-rag-fe:latest"
    pull_policy: always
    expose:
      - "80"
    volumes:
      - "caddy_data:/data"
volumes:
  caddy_data: null
  demo_budget: null
