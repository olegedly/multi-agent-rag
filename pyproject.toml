[project]
name = "multi-agent-rag"
version = "0.1.0"
description = "Multi-agent RAG research system with pgvector knowledge bases, LangChain agent pipeline, and a SolidJS chat frontend."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ag-ui-protocol>=0.1.19",
    "asyncpg>=0.31.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.136.3",
    "langchain>=1.0.0,<2.0.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-openai>=0.3.0",
    "langsmith>=0.3.0",
    "pgvector>=0.4.2",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.50",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # TestClient / httpx — StarletteDeprecationWarning (inherits UserWarning, not DeprecationWarning)
    "ignore::UserWarning:fastapi.testclient",
]
markers = ["httpx_mock: marks tests that use pytest-httpx (deselect with '-m \"not httpx_mock\"')"]

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = [
    "**/.git/**",
    "**/__pycache__/**",
    "**/.venv/**",
    "**/node_modules/**",
]
typeCheckingMode = "standard"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportDuplicateImport = "error"

[tool.fastapi]
entrypoint = "backend.main:app"
