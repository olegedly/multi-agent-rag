services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ".env"
    expose:
      - "8000"

  caddy:
    profiles: ["production"]
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/usr/share/caddy/html:ro
      - caddy_data:/data

volumes:
  caddy_data:
